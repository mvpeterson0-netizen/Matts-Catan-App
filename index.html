<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a3b1d">
<title>Matt's Catan Tracker</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header>
  <h1>Catan Tracker</h1>
  <input id="playerName" aria-label="Your name" placeholder="Your name">
</header>

<main>
  <!-- PROPERTIES -->
  <section id="tab-props" class="tab active">
    <p class="hint">Add each settlement or city and tap the hexes touching it. A hex you enter once is reused for every spot. Tap a hex chip to put the robber on it.</p>
    <div id="propList"></div>
    <button id="addProp" class="primary">+ Add settlement / city</button>
    <h3>Cards per roll</h3>
    <div id="payTable" class="card"></div>
    <div id="expected" class="card"></div>
    <button id="newGame" class="danger">Start new game</button>
  </section>

</main>

<dialog id="propDialog">
  <div id="propForm">
    <h2 id="dlgTitle">Add spot</h2>
    <div class="seg2" id="typePick">
      <button type="button" data-type="settlement" class="on">🏠 Settlement<small>1×</small></button>
      <button type="button" data-type="city">🏙️ City<small>2×</small></button>
    </div>
    <h3>Hexes touching it <span id="selCount" class="muted"></span></h3>
    <div id="slots"></div>
    <p class="hint" id="slotHint"></p>
    <div id="resPick" class="pick"></div>
    <div id="numPick" class="pick"></div>
    <h3>Reuse a hex you already entered</h3>
    <div id="hexPick"></div>
    <div class="row">
      <button type="button" id="dlgCancel" class="ghost">Cancel</button>
      <button type="button" id="dlgSave" class="primary">Save</button>
    </div>
  </div>
</dialog>

<script src="logic.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
